name: E2E and visual regression

# Runs everything in tests/e2e/ (Playwright) against the real static export, served under the same
# /toyota-showroom/ sub-path GitHub Pages actually serves it at (scripts/preview-server.mjs, wired
# up as playwright.config.ts's webServer). Separate from ci.yml's "verify" job so a flaky visual
# diff (see playwright.config.ts's maxDiffPixelRatio note) never blocks the fast unit/lint/typecheck
# gate that job is for.
on:
  pull_request:
  push:
    branches:
      - main
      - claude/toyota-showroom-integration-32nv6c

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
