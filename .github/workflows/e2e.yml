name: E2E and visual regression

# Runs everything in tests/e2e/ (Playwright) — interaction, visual regression, and the axe-core
# accessibility gate (tests/e2e/a11y.spec.ts, #42) — against the real static export, served under the same
# /toyota-showroom/ sub-path GitHub Pages actually serves it at (scripts/preview-server.mjs, wired
# up as playwright.config.ts's webServer). Also runs the Lighthouse builder-route budget (#79) after
# Playwright, reusing the same Chromium install. Separate from ci.yml's "verify" job so a flaky visual
# diff (see playwright.config.ts's maxDiffPixelRatio note) never blocks the fast unit/lint/typecheck
# gate that job is for.
on:
  pull_request:
  push:
    branches:
      - main
      - claude/toyota-showroom-integration-32nv6c

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      # Desktop Lighthouse on the builder route after the same production preview Playwright uses
      # (#79). Reuses the Chromium install above; fails on serious LCP/TBT or entry-JS gzip regressions.
      - name: Lighthouse budget (builder route)
        run: npm run test:perf
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
