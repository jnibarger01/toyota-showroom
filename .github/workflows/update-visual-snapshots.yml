name: Update visual snapshots

# Intentional Linux/Chromium snapshot refresh for tests/e2e/visual.spec.ts (#48).
#
# Prefer this over regenerating snapshots on macOS/Windows: font hinting differs enough
# that a local update commits platform noise as if it were an intentional UI change.
#
# Triggers:
#   1. Label a PR with `update-snapshots` — regenerates PNGs on ubuntu-latest and pushes
#      them back to the PR head branch, then removes the label.
#   2. workflow_dispatch on a branch — same regeneration + commit/push to that ref.
#
# One-command local equivalent (must still be Linux/Chromium to match CI):
#   npm run build && npm run test:e2e:update-visual
#
# See CONTRIBUTING.md § "Browser gate: visual snapshots and flakes".
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to update snapshots on (defaults to the branch that ran the workflow)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-visual-snapshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-snapshots:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'update-snapshots'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve checkout ref
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.ref }}" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          # Need the PR head token so the push below can update a fork-less same-repo branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Regenerate Linux Chromium visual snapshots
        # Scope to visual.spec.ts only — other e2e specs do not own PNG baselines.
        run: npm run test:e2e:update-visual

      - name: Commit and push snapshot updates
        shell: bash
        run: |
          if git diff --quiet -- tests/e2e/visual.spec.ts-snapshots/; then
            echo "No snapshot changes; baselines already match this Linux Chromium build."
            exit 0
          fi
          git add tests/e2e/visual.spec.ts-snapshots/
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$(cat <<'EOF'
          test: refresh Linux Chromium visual snapshots

          Regenerated by the update-visual-snapshots workflow (label
          update-snapshots / workflow_dispatch) so baselines match CI's
          Playwright Chromium rather than a local macOS/Windows render.
          EOF
          )"
          git push origin "HEAD:${{ steps.target.outputs.ref }}"

      - name: Remove update-snapshots label
        if: steps.target.outputs.pr != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.target.outputs.pr }}'),
              name: 'update-snapshots',
            }).catch((err) => {
              // Label already gone is fine (manual remove, or re-run).
              if (err.status !== 404) throw err;
            });
