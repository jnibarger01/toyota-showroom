name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/toyota-showroom-integration-32nv6c

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Run first and on its own so a catalog/GLB contract break reports as itself rather than as
      # one failure buried in the full suite — this is the check an option-authoring mistake trips.
      - run: npx vitest run tests/glbContract.test.ts
      # `--fail-on-contract-violation` re-derives the same node/material contract from the shipped
      # binaries and fails on an unsatisfied entry. The script and its test have existed since the
      # asset-pipeline work but no workflow ever invoked it, so the gate was documentation rather
      # than enforcement (#34).
      - run: npm run assets:report
      # The report is deterministic by design (no timings), so a diff here means a shipped asset
      # changed without its regenerated report being committed. Without this check the command
      # rewrote the file in CI and exited 0, leaving a stale report in the tree indefinitely.
      - name: Fail if the generated asset report is out of date
        run: git diff --exit-code -- docs/ASSET_PIPELINE_REPORT.md
      - run: npm test -- --run
      - run: npm run build
      # Must follow the build: route entry JS for `/`, `/explore`, `/4runner` plus every client
      # chunk. Over budget or missing budget entry fails with a readable report (#43).
      - run: npm run bundle:budget
      # Pages crawler files are written into public/ at prebuild and copied into dist/client (#78).
      - run: VERIFY_DIST=1 npx vitest run tests/sitemapRobots.test.ts
