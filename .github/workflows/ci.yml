name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/toyota-showroom-integration-32nv6c

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Run first and on its own so a catalog/GLB contract break reports as itself rather than as
      # one failure buried in the full suite — this is the check an option-authoring mistake trips.
      - run: npx vitest run tests/glbContract.test.ts
      # `--fail-on-contract-violation` re-derives the same node/material contract from the shipped
      # binaries and fails on an unsatisfied entry. The script and its test have existed since the
      # asset-pipeline work but no workflow ever invoked it, so the gate was documentation rather
      # than enforcement (#34).
      - run: npm run assets:report
      - run: npm test -- --run
      - run: npm run build
      # Must follow the build: it measures `dist/client/assets`. A chunk over budget, or a new chunk
      # with no budget at all, fails here rather than being absorbed silently (#43).
      - run: npm run bundle:budget
