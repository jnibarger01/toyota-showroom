name: Deploy Toyota Showroom

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          test -f dist/client/index.html
          test -f dist/client/sitemap.xml
          test -f dist/client/robots.txt
          test -f dist/client/sw.js
          touch dist/client/.nojekyll

      # #49 — bump CACHE_VERSION so Pages deploys are never sticky-cached forever.
      # `npm run build` already stamps; this is a belt-and-braces re-stamp with GITHUB_SHA.
      - name: Stamp demo service worker cache version
        run: npm run sw:stamp

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
